# Nginx reverse proxy for the backend API subdomain.
#
# Proxies api.teach-os.xyz -> the app container on 127.0.0.1:8000.
# `certbot --nginx -d api.teach-os.xyz` rewrites this block to add the TLS (443)
# server and an HTTP->HTTPS redirect.
server {
    listen 80;
    server_name api.teach-os.xyz;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
